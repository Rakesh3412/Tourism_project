<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/state.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>States</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            min-height:100vh;
            padding:10px;
            
        }

        .image {
    position: relative;
    height: 450px;
    overflow: hidden;
    border-radius: 20px;
}

.image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}
        .image::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0.25),
        transparent
    );
}
.img-txt p{
    color:green;
    padding:500px;
    height:1000px;
    background-color: red;
}
    </style>
</head>
<body>
    <main>
        <div class="image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10">
            <div class="img-txt">
                <p>Welcome to</p>
                <p>Rajasthan</p>
                <p>THE LAND OF KINGS</p>
                <P>Rajasthan is a land of rich culture.</P>
            </div>
        </div>
    </main>
</body>
</html>
